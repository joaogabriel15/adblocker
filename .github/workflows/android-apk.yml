name: APK Android

# Gera o APK de release a cada push/PR e quando acionado manualmente.
# O APK fica em "Artifacts" na página da execução (Actions).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - run: npx tsc --noEmit && npx jest
      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a
      - run: cp android/app/build/outputs/apk/release/app-release.apk adblocker.apk
      - uses: actions/upload-artifact@v4
        with:
          name: adblocker-apk
          path: adblocker.apk
